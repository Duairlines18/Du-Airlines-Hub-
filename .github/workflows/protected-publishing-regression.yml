name: Protected publishing regression QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'delivery-history.js'
      - 'qa/**'
      - '.github/workflows/protected-publishing-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publishing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate JavaScript syntax
        run: |
          node --check qa/workout-validation.js
          node --check qa/workout-validation.test.cjs
      - name: Install pinned DOM test dependency
        run: npm install --prefix /tmp/du-admin-qa --no-save jsdom@27.0.1
      - name: Run protected publishing regression
        run: node --test qa/*.test.cjs
        env:
          NODE_PATH: /tmp/du-admin-qa/node_modules

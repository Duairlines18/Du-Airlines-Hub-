<script>

const env=window.DU_AIRLINES_ENV||{};
const configured=!!(env.SUPABASE_URL&&env.SUPABASE_ANON_KEY);
const sb=configured?window.supabase.createClient(env.SUPABASE_URL,env.SUPABASE_ANON_KEY):null;

const state={
  page:'dashboard',
  admin:null,
  athletes:[],
  professionals:[],
  cohorts:[],
  staff:[],
  exercises:[],
  programmes:[],
  programmeWeeks:[],
  programmeTiers:[],
  trainingDays:[],
  sessionBlocks:[],
  feedback:[],
  blocks:[],
  sessions:[],
  accessCodes:[],
  programmeContext:null,
  selectedWeekId:null,
  athleteWorkspaceTab:'programme',
  workspaceTab:'programme',
  loadErrors:[]
};

const pages=['dashboard','athletes','cohorts','programmes','feedback','system'];
const labels={
  dashboard:'Overview',
  athletes:'Athletes',
  cohorts:'Schools',
  programmes:'Programme Builder',
  feedback:'Feedback',
  system:'System'
};

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmtDate=v=>v?new Date(v).toLocaleString():'—';
const byId=(rows,id)=>rows.find(x=>x.id===id);
const cohortFor=id=>byId(state.cohorts,id);
const cohortName=id=>cohortFor(id)?.name||'Not assigned';
const programmeName=id=>byId(state.programmes,id)?.name||'Not assigned';
const activeAccount=a=>a?.access_status==='active';
const isPrivateAthlete=a=>!!a?.athlete_user_id;
const isParentManaged=a=>!!a?.parent_user_id;
const athleteKind=a=>isParentManaged(a)?'Parent-managed':isPrivateAthlete(a)?'Private Athlete':'School / legacy profile';
const feedbackNeedsReview=f=>f.status!=='no_change'&&!f.reviewed_at;
const directProgrammeAthlete=a=>!!a?.programme_id;
const athleteCurrentWeek=a=>{
  const cohort=cohortFor(a?.cohort_id);
  return Number.isInteger(a?.current_week)?a.current_week:(cohort?.current_week||1);
};
const athleteProgrammeId=a=>a?.programme_id||cohortFor(a?.cohort_id)?.programme_id||null;
const athleteProgrammeName=a=>programmeName(athleteProgrammeId(a));
const programmeWeeksFor=(programmeId)=>state.programmeWeeks
  .filter(w=>w.programme_id===programmeId)
  .sort((a,b)=>(a.week_number||0)-(b.week_number||0));
const isPublishedWeek=w=>!!(w?.published_at&&w?.verification_status==='verified'&&(w?.status==='live'||w?.status==='completed'));
const weekStatusLabel=(w,currentWeek)=>{
  if(!w)return 'Not built';
  if(w.week_number===currentWeek&&isPublishedWeek(w))return 'Live';
  if(w.week_number<currentWeek&&isPublishedWeek(w))return 'Completed';
  if(isPublishedWeek(w))return 'Published';
  return 'Draft';
};
const feedbackForContext=(athleteId,cohortId,weekNumber)=>state.feedback
  .filter(f=>(athleteId&&f.athlete_id===athleteId)||(!athleteId&&cohortId&&f.cohort_id===cohortId))
  .filter(f=>f.week_number===weekNumber)
  .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
const exerciseByCode=code=>state.exercises.find(e=>e.code===code);
const prettyPrescription=p=>{
  const ex=exerciseByCode(p.exerciseCode);
  const name=ex?.name||p.exerciseCode||'Exercise';
  const video=ex?.video_id||ex?.video_url;
  return `<div style="margin:8px 0"><span class="exercise-name">${esc(name)}</span><div class="exercise-meta">${esc(p.dosage||'')}${p.rest?' · Rest '+esc(p.rest):''}${p.cues?' · '+esc(p.cues):''}</div>${video?'<div class="video-ok">Video attached ✓</div>':''}</div>`;
};

const programmeFutureWeeks=(programmeId,currentWeek)=>programmeWeeksFor(programmeId).filter(w=>Number(w.week_number)>Number(currentWeek));
const programmeWeekByNumber=(programmeId,n)=>programmeWeeksFor(programmeId).find(w=>Number(w.week_number)===Number(n));
const daysForWeek=weekId=>state.trainingDays.filter(d=>d.programme_week_id===weekId);
const blockHasContent=block=>{
  const c=block?.content||{};
  const prescriptions=Array.isArray(c.prescriptions)?c.prescriptions:[];
  const items=Array.isArray(c.items)?c.items:[];
  return prescriptions.length>0||items.length>0;
};
const weekReadiness=(programmeId,weekNumber)=>{
  const week=programmeWeekByNumber(programmeId,weekNumber);
  if(!week)return {level:'missing',label:'Not built',issues:['Week record missing'],week:null,days:0,blocks:0};
  const days=daysForWeek(week.id);
  const blocks=days.flatMap(d=>blocksForDay(d.id));
  const issues=[];
  if(!days.length)issues.push('No training days');
  if(!blocks.length)issues.push('No workout blocks');
  const emptyBlocks=blocks.filter(b=>!blockHasContent(b));
  if(emptyBlocks.length)issues.push(`${emptyBlocks.length} empty workout block${emptyBlocks.length===1?'':'s'}`);
  const invalidCodes=[];
  for(const block of blocks){
    const p=Array.isArray(block.content?.prescriptions)?block.content.prescriptions:[];
    for(const item of p){
      if(item.exerciseCode&&!exerciseByCode(item.exerciseCode))invalidCodes.push(item.exerciseCode);
      if(item.alternativeExerciseCode&&!exerciseByCode(item.alternativeExerciseCode))invalidCodes.push(item.alternativeExerciseCode);
    }
  }
  if(invalidCodes.length)issues.push(`Missing exercise reference: ${[...new Set(invalidCodes)].join(', ')}`);
  if(issues.length)return {level:'incomplete',label:'Incomplete',issues,week,days:days.length,blocks:blocks.length};
  return {level:isPublishedWeek(week)?'live':'ready',label:isPublishedWeek(week)?'Published':'Ready',issues:[],week,days:days.length,blocks:blocks.length};
};
const nextWeekPrepared=(programmeId,currentWeek)=>['ready','live'].includes(weekReadiness(programmeId,Number(currentWeek)+1).level);
const seriousFeedback=f=>{
  const p=f?.payload||{};
  const pain=String(p.pain||'').toLowerCase();
  const attention=String(p.attention||'').toLowerCase();
  const change=String(p.programmeChange||'').toLowerCase();
  return f?.status==='adjustment_flagged'||['moderate','significant'].includes(pain)||attention==='adjustment needed'||change==='yes';
};
const accessCodeExpired=c=>!!(c.expires_at&&new Date(c.expires_at).getTime()<Date.now());
const operationalAttention=()=>{
  const items=[];
  state.athletes.forEach(a=>{
    const pid=athleteProgrammeId(a),cw=athleteCurrentWeek(a),name=a.full_name||a.display_name||'Athlete';
    const hasAccount=!!(a.parent_user_id||a.athlete_user_id);
    if(hasAccount&&a.access_status!=='active'){
      items.push({priority:1,kind:'athlete-setup',title:name,detail:`Access ${a.access_status||'pending'}${a.access_reason?' · '+a.access_reason:''}`,id:a.id});
    }
    if(hasAccount&&!a.onboarding_complete){
      items.push({priority:1,kind:'athlete-setup',title:name,detail:'Onboarding incomplete',id:a.id});
    }
    if(!pid){
      if(hasAccount||a.access_status==='active')items.push({priority:1,kind:'athlete-setup',title:name,detail:'Programme not assigned',id:a.id});
      return;
    }
    const current=weekReadiness(pid,cw);
    if(current.level==='missing'||current.level==='incomplete'){
      items.push({priority:0,kind:'athlete',title:name,detail:`CURRENT WEEK ${cw} ${current.level==='missing'?'not built':'incomplete'}${current.issues.length?' · '+current.issues.join(' · '):''}`,id:a.id});
    }
    const total=Number(byId(state.programmes,pid)?.duration_weeks||0);
    const next=weekReadiness(pid,cw+1);
    if(total&&cw>=total)items.push({priority:2,kind:'athlete',title:name,detail:'Current programme block ends this week',id:a.id});
    else if(next.level==='missing')items.push({priority:1,kind:'athlete',title:name,detail:`Week ${cw+1} is not built`,id:a.id});
    else if(next.level==='incomplete')items.push({priority:1,kind:'athlete',title:name,detail:`Week ${cw+1} is incomplete · ${next.issues.join(' · ')}`,id:a.id});
  });
  state.cohorts.filter(c=>c.status==='live').forEach(c=>{
    if(!c.programme_id){items.push({priority:1,kind:'cohort-setup',title:c.name,detail:'Programme not assigned',id:c.id});return;}
    const cw=Number(c.current_week||1),current=weekReadiness(c.programme_id,cw);
    if(current.level==='missing'||current.level==='incomplete'){
      items.push({priority:0,kind:'cohort',title:c.name,detail:`CURRENT WEEK ${cw} ${current.level==='missing'?'not built':'incomplete'}${current.issues.length?' · '+current.issues.join(' · '):''}`,id:c.id});
    }
    const total=Number(byId(state.programmes,c.programme_id)?.duration_weeks||0),next=weekReadiness(c.programme_id,cw+1);
    if(total&&cw>=total)items.push({priority:2,kind:'cohort',title:c.name,detail:'Current programme block ends this week',id:c.id});
    else if(next.level==='missing')items.push({priority:1,kind:'cohort',title:c.name,detail:`Week ${cw+1} is not built`,id:c.id});
    else if(next.level==='incomplete')items.push({priority:1,kind:'cohort',title:c.name,detail:`Week ${cw+1} is incomplete · ${next.issues.join(' · ')}`,id:c.id});
    const codes=state.accessCodes.filter(code=>code.cohort_id===c.id);
    codes.forEach(code=>{
      if(code.status!=='active'||accessCodeExpired(code)){
        items.push({priority:1,kind:'cohort',title:c.name,detail:`${code.code_type==='staff'?'Staff':'Athlete'} access ${accessCodeExpired(code)?'expired':code.status}`,id:c.id});
      }
    });
  });
  state.feedback.filter(feedbackNeedsReview).forEach(f=>items.push({
    priority:seriousFeedback(f)?0:3,
    kind:'feedback',
    title:feedbackWho(f),
    detail:`${seriousFeedback(f)?'Feedback needs attention':'Feedback waiting'} · Week ${f.week_number||'—'}${f.payload?.pain?' · Pain: '+f.payload.pain:''}`,
    id:f.id,athlete_id:f.athlete_id||null,cohort_id:f.cohort_id||null
  }));
  const dedup=new Map();
  items.forEach(x=>dedup.set([x.kind,x.id,x.title,x.detail].join('|'),x));
  return [...dedup.values()].sort((a,b)=>a.priority-b.priority||String(a.title).localeCompare(String(b.title)));
};
const exerciseMatch=value=>{
  const raw=String(value||'').trim().toLowerCase();
  if(!raw)return null;
  return state.exercises.find(e=>String(e.code||'').toLowerCase()===raw||String(e.name||'').toLowerCase()===raw||`${String(e.name||'').toLowerCase()} — ${String(e.code||'').toLowerCase()}`===raw)||null;
};
const exerciseOptionsList=()=>`<datalist id="exerciseOptions">${state.exercises.filter(e=>e.active!==false).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''))).map(e=>`<option value="${esc(e.name||e.code)}">${esc(e.category_slug||'Exercise')} · ${esc(e.code||'')}</option>`).join('')}</datalist>`;

const feedbackLabel=f=>{
  if(f.status==='adjustment_flagged')return 'Adjustment flagged';

function nav(){

async function tableRows(table,key,order='created_at'){
  const {data,error}=await sb.from(table).select('*').order(order,{ascending:false});
  if(error){
    state.loadErrors.push(`${table}: ${error.message}`);
    state[key]=[];
    return;
  }
  state[key]=data||[];
}

async function load(){
  if(!sb)return;
  state.loadErrors=[];
  await Promise.all([
    tableRows('athletes','athletes'),
    tableRows('professional_members','professionals'),
    tableRows('cohorts','cohorts'),
    tableRows('staff_profiles','staff'),
    tableRows('exercises','exercises'),
    tableRows('programmes','programmes'),
    tableRows('programme_weeks','programmeWeeks'),
    tableRows('programme_tiers','programmeTiers','sort_order'),
    tableRows('training_days','trainingDays','sort_order'),
    tableRows('session_blocks','sessionBlocks','sort_order'),
    tableRows('feedback','feedback'),
    tableRows('saved_blocks','blocks'),
    tableRows('hub_sessions','sessions'),
    tableRows('access_codes','accessCodes')
  ]);
  render();
}

function loadWarning(){

function globalSearchRows(query){
  const q=String(query||'').trim().toLowerCase();
  if(q.length<2)return [];
  const rows=[];
  state.athletes.forEach(a=>{
    const name=a.full_name||a.display_name||'Athlete';
    const hay=[name,athleteProgrammeName(a),cohortName(a.cohort_id),athleteKind(a)].join(' ').toLowerCase();
    if(hay.includes(q))rows.push({type:'athlete',id:a.id,title:name,meta:`Athlete · ${athleteProgrammeName(a)} · Week ${athleteCurrentWeek(a)}`});
  });
  state.cohorts.forEach(c=>{
    const hay=[c.name,programmeName(c.programme_id),c.tier||''].join(' ').toLowerCase();
    if(hay.includes(q))rows.push({type:'cohort',id:c.id,title:c.name,meta:`School / Cohort · ${programmeName(c.programme_id)} · Week ${c.current_week||1}`});
  });
  state.programmes.forEach(p=>{
    if(String(p.name||'').toLowerCase().includes(q))rows.push({type:'programme',id:p.id,title:p.name,meta:'Programme'});
  });
  state.exercises.forEach(ex=>{
    const hay=[ex.name,ex.code,ex.category_slug,(ex.categories||[]).join(' ')].join(' ').toLowerCase();
    if(hay.includes(q))rows.push({type:'exercise',id:ex.id,title:ex.name,meta:`Exercise${ex.video_id||ex.video_url?' · Video ✓':''}`});
  });
  return rows.slice(0,12);
}
function renderGlobalSearch(){
  const input=document.getElementById('globalSearch'),box=document.getElementById('globalSearchResults');
  if(!input||!box)return;
  const rows=globalSearchRows(input.value);
  if(!rows.length){box.classList.add('hidden');box.innerHTML='';return;}
  box.innerHTML=rows.map(r=>`<button type="button" class="global-result" data-global-type="${esc(r.type)}" data-global-id="${esc(r.id)}"><span><strong>${esc(r.title)}</strong><small>${esc(r.meta)}</small></span><span>Open →</span></button>`).join('');
  box.classList.remove('hidden');
}
function closeGlobalSearch(){
  const box=document.getElementById('globalSearchResults'),input=document.getElementById('globalSearch');
  if(box){box.classList.add('hidden');box.innerHTML='';}
  if(input)input.value='';
}

function contextDetails(){
   const ctx=state.programmeContext;
   if(!ctx)return null;
   let cohort=null,label='',account=null,programmeId=null,currentWeek=1,direct=false;
   if(ctx.type==='cohort'){
     cohort=byId(state.cohorts,ctx.id);
     label=cohort?.name||'Cohort';
     programmeId=cohort?.programme_id||null;
     currentWeek=cohort?.current_week||1;
   }else if(ctx.type==='athlete'){
     account=byId(state.athletes,ctx.id);
     cohort=cohortFor(account?.cohort_id);
     label=account?.full_name||account?.display_name||'Athlete';
     programmeId=athleteProgrammeId(account);
     currentWeek=athleteCurrentWeek(account);
     direct=!!account?.programme_id;
   }else if(ctx.type==='professional'){
     account=byId(state.professionals,ctx.id);
     cohort=cohortFor(account?.cohort_id);
     label=[account?.first_name,account?.last_name].filter(Boolean).join(' ')||account?.email||'Professional';
     programmeId=cohort?.programme_id||null;
     currentWeek=cohort?.current_week||1;
   }
   if(!programmeId)return null;
   return {ctx,cohort,label,account,programmeId,currentWeek,direct};
}

function weekForCohort(cohort){
  if(!cohort?.programme_id)return null;
  const candidates=state.programmeWeeks.filter(w=>w.programme_id===cohort.programme_id&&w.week_number===cohort.current_week);
  if(!candidates.length)return null;
  if(cohort.tier){
    const tier=state.programmeTiers.find(t=>t.programme_id===cohort.programme_id&&String(t.name||'').toLowerCase()===String(cohort.tier||'').toLowerCase());
    if(tier){
      const exact=candidates.find(w=>w.tier_id===tier.id);
      if(exact)return exact;
    }
  }
  return candidates.find(w=>!w.tier_id)||candidates[0];
}

const QW_ALIASES={
  'pogos':'PLY03','pogo':'PLY03','two leg pogos':'PLY03','two leg pogo':'PLY03',
  'sl pogos':'PLY07','single leg pogo':'PLY07','single leg pogos':'PLY07',
  'hip lock':'POST01','hip lock hold':'POST01',
  'a march':'SPR01','a marches':'SPR01',
  'a skip':'SPR02','a skips':'SPR02',
  'sl rdl':'STR03','single leg rdl':'STR03',
  'soleus':'ANK02','soleus hold':'ANK02',
  'calves':'ANK01','calf raises':'ANK01',
  'tib raise':'ANK04','tib raises':'ANK04',
  'broad jump':'PLY02','broad jump stick':'PLY02',
  'snapdown':'PLY01','snap down':'PLY01',
  'falling starts':'ACC03','falling start':'ACC03',
  '2 point start':'ACC04','two point start':'ACC04',
  'wall marches':'ACC01','wall march':'ACC01',
  'wall switches':'ACC02','wall switch':'ACC02'
};
function qwNormalize(value){
  return String(value||'').toLowerCase()
    .replace(/&/g,' and ')
    .replace(/[-_/]+/g,' ')
    .replace(/[^\w\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function qwExerciseCandidates(line){
  const raw=qwNormalize(line);
  const active=state.exercises.filter(e=>e.active!==false);
  const aliasKey=Object.keys(QW_ALIASES).sort((a,b)=>b.length-a.length).find(a=>raw===a||raw.startsWith(a+' '));
  const aliasCode=aliasKey?QW_ALIASES[aliasKey]:'';
  const scored=active.map(ex=>{
    const name=qwNormalize(ex.name),code=qwNormalize(ex.code);
    let score=0;
    if(aliasCode&&ex.code===aliasCode)score=100;
    else if(raw===name||raw===code)score=100;
    else if(raw.startsWith(name+' '))score=96;
    else if(raw.startsWith(code+' '))score=94;
    else if(raw.includes(name))score=85;
    else{
      const nameTokens=name.split(' ').filter(Boolean);
      const rawTokens=new Set(raw.split(' ').filter(Boolean));
      const matched=nameTokens.filter(t=>rawTokens.has(t)).length;
      score=nameTokens.length?Math.round((matched/nameTokens.length)*70):0;
      if(nameTokens.length===1&&matched)score=Math.max(score,72);
    }
    return {ex,score};
  }).filter(x=>x.score>=45).sort((a,b)=>b.score-a.score||String(a.ex.name).localeCompare(String(b.ex.name)));
  return scored.slice(0,5);
}
function qwParsePrescription(line,match){
  const ex=match?.ex||null;
  let restText='';
  const restMatch=String(line).match(/\b(?:rest\s*(\d+(?:\.\d+)?)\s*(sec|secs|second|seconds|min|mins|minute|minutes)|(\d+(?:\.\d+)?)\s*(sec|secs|second|seconds|min|mins|minute|minutes)\s*rest)\b/i);
  if(restMatch){
    const amount=restMatch[1]||restMatch[3],unit=restMatch[2]||restMatch[4];
    restText=(amount+' '+unit).replace(/secs?/i,'sec').replace(/seconds?/i,'sec').replace(/mins?/i,'min').replace(/minutes?/i,'min');
  }
  let remainder=String(line);
  if(ex){
    const namePattern=ex.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'[\\s\\-_/]*');
    remainder=remainder.replace(new RegExp('^\\s*'+namePattern+'\\s*','i'),'');
    if(remainder===line&&ex.code)remainder=remainder.replace(new RegExp('^\\s*'+ex.code.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*','i'),'');
  }
  if(restMatch)remainder=remainder.replace(restMatch[0],'').trim().replace(/^[,;:\-–—]+|[,;:\-–—]+$/g,'').trim();
  const cueMatch=remainder.match(/\b(?:cue|cues)\s*:\s*(.+)$/i);
  const cues=cueMatch?cueMatch[1].trim():'';
  if(cueMatch)remainder=remainder.replace(cueMatch[0],'').trim().replace(/[,;:\-–—]+$/g,'').trim();
  return {
    exerciseCode:ex?.code||'',
    dosage:remainder||ex?.default_dosage||'',
    rest:restText,
    equipment:'',
    cues:cues||ex?.coaching_cues||''
  };
}
function qwLooksLikeHeading(line){
  const clean=String(line||'').trim();
  if(!clean)return false;
  const known=['warm up','warmup','activation','mobility','acceleration','speed','sprint','sprints','plyometrics','plyometric','jumps','jumping','strength','core','conditioning','cool down','cooldown','recovery','technical','technique'];
  const normalized=qwNormalize(clean.replace(/:$/,''));
  if(known.includes(normalized))return true;
  return /:$/.test(clean)&&clean.length<60;
}
function qwParseText(raw){
  const lines=String(raw||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const blocks=[];
  let current=null;
  for(const line of lines){
    if(qwLooksLikeHeading(line)){
      current={title:line.replace(/:$/,'').trim(),block_type:'workout',focus:'',items:[]};
      blocks.push(current);continue;
    }
    if(!current){current={title:'Workout',block_type:'workout',focus:'',items:[]};blocks.push(current);}
    const candidates=qwExerciseCandidates(line),best=candidates[0]||null;
    const confident=!!best&&best.score>=80;
    current.items.push({
      source:line,
      candidates,
      selectedCode:confident?best.ex.code:'',
      prescription:qwParsePrescription(line,confident?best:null),
      confident
    });
  }
  return blocks.filter(b=>b.items.length);
}

async function saveQuickWrite(){
  const dayId=document.getElementById('qwDayId')?.value,holder=document.getElementById('qwPreview');if(!dayId||!holder)return;
  let parsed=[];try{parsed=JSON.parse(holder.dataset.blocks||'[]')}catch(e){alert('Preview the workout again before saving.');return;}
  const unresolved=parsed.flatMap(b=>b.items||[]).filter(i=>!i.selectedCode);
  if(unresolved.length){alert('Match every exercise before saving.');return;}
  const blocks=parsed.map(b=>{
    const prescriptions=(b.items||[]).map(i=>{
      const ex=exerciseByCode(i.selectedCode),p=qwParsePrescription(i.source,ex?{ex}:null);
      return {exerciseCode:i.selectedCode,dosage:p.dosage,rest:p.rest,equipment:p.equipment,cues:p.cues};
    });
    return {block_type:b.block_type||'workout',title:b.title||'Workout',content:{focus:b.focus||'',prescriptions,exerciseCodes:prescriptions.map(p=>p.exerciseCode)}};
  });
  if(!blocks.length){alert('No workout blocks to save.');return;}
  if(!confirm(`Replace this training day with ${blocks.length} Quick Write block${blocks.length===1?'':'s'}?`))return;
  const button=document.getElementById('saveQuickWrite');button.disabled=true;const original=button.textContent;button.textContent='Saving…';
  try{
    const {data,error}=await sb.rpc('admin_replace_training_day_blocks',{p_training_day_id:dayId,p_blocks:blocks});
    if(error)throw error;
    document.getElementById('modal').close();await load();alert('Workout saved. A recovery snapshot of the previous day was created automatically.');
  }catch(error){alert(error.message||'Unable to save Quick Write workout.');button.disabled=false;button.textContent=original;}
}

async function copyProgrammeWeek(sourceWeekId){
  const source=byId(state.programmeWeeks,sourceWeekId);if(!source)return;
  const sourceReady=weekReadiness(source.programme_id,source.week_number);
  if(sourceReady.level==='missing'||sourceReady.level==='incomplete'){
    alert('Finish this source week before copying it:\n\n'+sourceReady.issues.join('\n'));return;
  }
  const proposed=Number(source.week_number||0)+1;
  const raw=prompt(`Copy Week ${source.week_number} to which week?`,String(proposed));
  if(raw===null)return;
  const target=Number(raw);
  if(!Number.isInteger(target)||target<1){alert('Enter a valid week number.');return;}
  if(!confirm(`Copy Week ${source.week_number} into Week ${target}? The copied week will stay Draft / hidden.`))return;
  try{
    const {error}=await sb.rpc('admin_copy_programme_week',{p_source_week_id:sourceWeekId,p_target_week_number:target});
    if(error)throw error;
    await load();
    const created=programmeWeekByNumber(source.programme_id,target);
    if(created)state.selectedWeekId=created.id;
    render();
    alert(`Week ${target} created as a draft.`);
  }catch(error){alert(error.message||'Unable to copy this programme week.');}
}
async function publishProgrammeWeek(weekId){
  const week=byId(state.programmeWeeks,weekId);if(!week)return;
  const ready=weekReadiness(week.programme_id,week.week_number);
  if(ready.level==='missing'||ready.level==='incomplete'){
    alert('This week is not ready to publish:\\n\\n'+ready.issues.join('\\n'));return;
  }
  const d=contextDetails();if(!d)return;
  let targetType='',targetId='',audience='';
  if(d.ctx.type==='cohort'||(!d.direct&&d.cohort?.id)){
    targetType='cohort';targetId=d.cohort.id;audience=d.cohort.name;
  }else if(d.ctx.type==='athlete'&&d.account?.id){
    targetType='athlete';targetId=d.account.id;audience=d.label;
  }else{
    alert('This programme context cannot be published from here yet.');return;
  }
  const sharedCount=targetType==='athlete'
    ?state.athletes.filter(a=>athleteProgrammeId(a)===week.programme_id&&a.access_status==='active').length
    :membersInCohort(targetId);
  const sharedNote=targetType==='athlete'&&sharedCount>1
    ?`\\n\\n${sharedCount} active athletes use this programme. Only ${audience}'s current week will advance.`
    :'';
  if(!confirm(`Publish Week ${week.week_number} to ${audience}?\\n\\n${ready.days} training day(s) · ${ready.blocks} workout block(s)\\nThis will make the week live and advance this ${targetType} to Week ${week.week_number}.${sharedNote}`))return;
  try{
    const {error}=await sb.rpc('admin_publish_programme_week',{p_week_id:weekId,p_target_type:targetType,p_target_id:targetId});
    if(error)throw error;
    await load();state.selectedWeekId=weekId;render();

async function saveTrainingDay(){
  const id=document.getElementById('editDayId').value;
  const editDay=byId(state.trainingDays,id);
  if(!confirmLiveEdit(editDay,'Editing this training day'))return;
  const url=String(document.getElementById('dayPlaylistUrl').value||'').trim();
  let playlistId='';
  if(url){
    playlistId=playlistIdFromUrl(url);
    if(!playlistId){alert('Use a valid YouTube playlist URL containing a list= value, or leave the field blank.');return;}
  }
  const update={
    title:String(document.getElementById('dayTitle').value||'').trim(),
    intensity:String(document.getElementById('dayIntensity').value||'').trim(),
    duration:String(document.getElementById('dayDuration').value||'').trim(),
    objective:String(document.getElementById('dayObjective').value||'').trim(),
    playlist_url:url||null,
    playlist_id:playlistId||null
  };
  const ok=confirm('Save this training-day update to Supabase? If the week is live, athletes in this cohort can see the change when they reload the Hub.');
  if(!ok)return;

  if(error){alert(error.message);return;}
  document.getElementById('modal').close();
  await load();
}

async function saveWorkoutBlock(){
  const id=document.getElementById('editBlockId').value;
  const block=byId(state.sessionBlocks,id);
  if(!block)return;
  const editDay=byId(state.trainingDays,block.training_day_id);
  if(!confirmLiveEdit(editDay,'Editing this workout block'))return;
  const content={...(block.content||{})};
  content.focus=String(document.getElementById('blockFocus').value||'').trim();
  content.requirement=String(document.getElementById('blockRequirement').value||'').trim();
  const why=String(document.getElementById('blockWhy').value||'').trim();
  const watch=String(document.getElementById('blockWatch').value||'').trim();
  if(why)content.why=why;else delete content.why;
  if(watch)content.watch=watch;else delete content.watch;

  const prescriptionInputs=[...document.querySelectorAll('[data-prescription-field]')];
  if(prescriptionInputs.length){
    const prescriptions=Array.isArray(content.prescriptions)?content.prescriptions.map(p=>({...p})):[];
    for(const input of prescriptionInputs){
      const i=+input.dataset.prescriptionIndex;
      const field=input.dataset.prescriptionField;
      if(!prescriptions[i])prescriptions[i]={};
      const raw=String(input.value||'').trim();
      if(field==='exerciseCode'||field==='alternativeExerciseCode'){
        if(!raw){prescriptions[i][field]='';continue;}
        const match=exerciseMatch(raw);
        if(!match){alert('Choose a valid exercise from the library: '+raw);return;}
        prescriptions[i][field]=match.code;
      }else prescriptions[i][field]=raw;
    }
    content.prescriptions=prescriptions;
    if(Array.isArray(content.exerciseCodes)){
      content.exerciseCodes=prescriptions.map(p=>p.exerciseCode).filter(Boolean);
    }
  }else{
    const itemsBox=document.getElementById('blockItems');
    if(itemsBox)content.items=String(itemsBox.value||'').split('\n').map(x=>x.trim()).filter(Boolean);
  }

  const update={
    title:String(document.getElementById('blockTitle').value||'').trim(),
    athlete_note:String(document.getElementById('blockAthleteNote').value||'').trim(),
    content
  };
  const ok=confirm('Save this workout tweak to Supabase? This edits the current programme block and can appear in the Hub on reload.');
  if(!ok)return;
  const {error}=await sb.from('session_blocks').update(update).eq('id',id);
  if(error){alert(error.message);return;}
  document.getElementById('modal').close();
  await load();
}

async function saveSubstitutions(){
  const id=document.getElementById('subAthleteId').value,rows=[];
  for(const row of document.querySelectorAll('[data-swap-row]')){
    const fromRaw=String(row.querySelector('[data-swap-from]')?.value||'').trim(),toRaw=String(row.querySelector('[data-swap-to]')?.value||'').trim();
    if(!fromRaw&&!toRaw)continue;
    const from=exerciseMatch(fromRaw),to=exerciseMatch(toRaw);
    if(!from||!to||from.code===to.code){alert('Choose two different valid exercises from the library for each swap.');return;}
    rows.push({fromExerciseCode:from.code,toExerciseCode:to.code,note:String(row.querySelector('[data-swap-note]')?.value||'').trim().slice(0,500)});
  }
  if(rows.length>20){alert('Keep substitutions to 20 or fewer.');return;}
  const {error}=await sb.from('athletes').update({exercise_substitutions:rows}).eq('id',id);
  if(error){alert(error.message);return;}document.getElementById('modal').close();await load();
}

  openModal(`<h2>Create ${label} Access Code</h2><p class="muted">Choose the cohort and create a code of at least 12 characters. The readable code is shown only when you create it.</p>
  <div class="formgrid">
    <label class="wide">Cohort<select name="target_id" required>${options}</select></label>
    <label class="wide">Label<input name="label" required placeholder="Example: Saints Athlete Term 3"></label>
    <label class="wide">Access code<input name="raw_code" required minlength="12" maxlength="128" autocomplete="off" placeholder="Example: SAINTS-ATHLETE-2026"></label>
    <label class="wide">Expiry (optional)<input name="expires_at" type="datetime-local"></label>
  </div>
  <input type="hidden" name="code_type" value="${type}">
  <div class="notice">The Hub normalizes codes to lowercase before hashing. This form uses the same rule.</div>
  <div class="row" style="margin-top:18px"><button value="cancel" class="btn ghost">Cancel</button><button type="button" class="btn primary" id="saveAccessCode">Create Code</button></div>`);
}

async function saveAccessCode(){
  const f=new FormData(document.getElementById('modalForm'));
  const type=String(f.get('code_type')||'');
  const target=String(f.get('target_id')||'');
  const raw=String(f.get('raw_code')||'').trim();
  const label=String(f.get('label')||'').trim();
  const expiry=String(f.get('expires_at')||'').trim();
  if(!target||!label||raw.length<12||raw.length>128){alert('Choose a cohort, add a label, and use a code between 12 and 128 characters.');return;}
  const bytes=new TextEncoder().encode(raw.toLowerCase());
  const digest=await crypto.subtle.digest('SHA-256',bytes);
  const hash=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
  const row={code_type:type,code_hash:hash,status:'active',cohort_id:target,label};
  if(expiry)row.expires_at=new Date(expiry).toISOString();
  const {error}=await sb.from('access_codes').insert(row);
  if(error){alert(error.message);return;}
  document.getElementById('modal').close();
  await load();
  alert('Access code created ✅\n\nCode: '+raw+'\n\nThis readable code is not stored in Supabase. Save/share it securely.');
}

async function save(table,obj,id){
  const q=id?sb.from(table).update(obj).eq('id',id):sb.from(table).insert(obj);
  const {error}=await q;
  if(error){alert(error.message);return false;}
  document.getElementById('modal').close();
  await load();
  return true;
}

async function changeAccountAccess(kind,id,action){
  const table=kind==='professional'?'professional_members':'athletes';
  const row=kind==='professional'?byId(state.professionals,id):byId(state.athletes,id);
  if(!row)return;
  let update={};
  if(action==='activate'){
    if(!row.cohort_id){alert('Assign a cohort before activating access.');return;}
    update={access_status:'active',access_reason:'complimentary',payment_status:'not_required',paid:false};
  }else if(action==='pause'){
    update={access_status:'paused'};
  }else if(action==='resume'){
    if(!row.cohort_id||!row.access_reason||!row.payment_status){alert('This record is missing its entitlement details. Use Activate Complimentary instead of forcing access.');return;}
    update={access_status:'active'};
  }else return;
  const {error}=await sb.from(table).update(update).eq('id',id);
  if(error){alert(error.message);return;}
  await load();
}

async function changeCodeStatus(id,action){
  const status=action==='activate'?'active':action==='pause'?'paused':action==='archive'?'archived':'';
  if(!status)return;
  const {error}=await sb.from('access_codes').update({status}).eq('id',id);
  if(error){alert(error.message);return;}
  await load();
}

function publishedWeekReady(programmeId,weekNumber){
  return state.programmeWeeks.some(w=>w.programme_id===programmeId&&w.week_number===weekNumber&&w.published_at&&w.verification_status==='verified'&&(w.status==='live'||w.status==='completed'));
}

document.addEventListener('click',async e=>{

    if(type==='cohort'){state.programmeContext={type:'cohort',id};state.selectedWeekId=null;state.workspaceTab='programme';state.page='programme-editor';render();return;}
    if(type==='programme'){state.page='programmes';render();return;}

  }
  const p=e.target.closest('[data-page]');

  const add=e.target.closest('[data-add]');
  if(add){
    if(add.dataset.add==='cohort')cohortForm();
    else if(add.dataset.add==='exercise')exerciseForm();
    return;
  }

  const oa=e.target.closest('[data-open-athlete]');
  if(oa){state.programmeContext={type:'athlete',id:oa.dataset.openAthlete};state.selectedWeekId=null;state.workspaceTab='programme';state.page='athlete-workspace';render();return;}

  if(oc){state.programmeContext={type:'cohort',id:oc.dataset.openCohort};state.selectedWeekId=null;state.workspaceTab='programme';state.page='programme-editor';render();return;}

  const wt=e.target.closest('[data-workspace-tab]');
  if(wt){state.workspaceTab=wt.dataset.workspaceTab||'programme';render();return;}

  const quickWrite=e.target.closest('[data-quick-write]');
  if(quickWrite){const day=byId(state.trainingDays,quickWrite.dataset.quickWrite);if(day)return quickWriteForm(day);}

  const qwSelect=e.target.closest('[data-qw-select]');
  if(qwSelect){quickWriteSelectionChanged(qwSelect);return;}

  const addDay=e.target.closest('[data-add-day]');
  if(addDay){const week=byId(state.programmeWeeks,addDay.dataset.addDay);if(week)return addTrainingDayForm(week);}

  const addBlock=e.target.closest('[data-add-block]');
  if(addBlock){const day=byId(state.trainingDays,addBlock.dataset.addBlock);if(day)return addBlockForm(day);}

  const addExercise=e.target.closest('[data-add-exercise]');
  if(addExercise){const block=byId(state.sessionBlocks,addExercise.dataset.addExercise);if(block)return addExerciseForm(block);}

  const removeExercise=e.target.closest('[data-remove-prescription]');
  if(removeExercise)return removePrescription(removeExercise.dataset.removePrescription,Number(removeExercise.dataset.prescriptionIndex));

  const copyWeek=e.target.closest('[data-copy-week]');
  if(copyWeek)return copyProgrammeWeek(copyWeek.dataset.copyWeek);

  const publishWeek=e.target.closest('[data-publish-week]');
  if(publishWeek)return publishProgrammeWeek(publishWeek.dataset.publishWeek);

  const sw=e.target.closest('[data-select-week]');
  if(sw){state.selectedWeekId=sw.dataset.selectWeek;render();return;}

  const pc=e.target.closest('[data-programme-context]');
  if(pc){
    state.programmeContext={type:pc.dataset.programmeContext,id:pc.dataset.programmeId};
    state.selectedWeekId=null;
    state.page='programme-editor';
    render();
    return;
  }

  const pd=e.target.closest('[data-preview-day]');
  if(pd){
    const day=byId(state.trainingDays,pd.dataset.previewDay);
    if(day)return previewDay(day);
  }

  const ed=e.target.closest('[data-edit-day]');
  if(ed){
    const day=byId(state.trainingDays,ed.dataset.editDay);
    if(day)return dayEditor(day);
  }

  const eb=e.target.closest('[data-edit-block]');
  if(eb){
    const block=byId(state.sessionBlocks,eb.dataset.editBlock);
    if(block)return blockEditor(block);
  }

  const sub=e.target.closest('[data-substitutions]');
  if(sub){
    const athlete=byId(state.athletes,sub.dataset.substitutions);
    if(athlete)return substitutionForm(athlete);
  }

    const ae=e.target.closest('[data-edit-athlete]');
  if(ae)return athleteForm(byId(state.athletes,ae.dataset.editAthlete)||{});

  const pe=e.target.closest('[data-edit-professional]');
  if(pe)return professionalForm(byId(state.professionals,pe.dataset.editProfessional)||{});

  const ce=e.target.closest('[data-edit-cohort]');
  if(ce)return cohortForm(byId(state.cohorts,ce.dataset.editCohort)||{});

  const ee=e.target.closest('[data-edit-exercise]');

  const access=e.target.closest('[data-access-action]');
  if(access)return changeAccountAccess(access.dataset.accessKind,access.dataset.accessId,access.dataset.accessAction);

  const cr=e.target.closest('[data-code-type]');
  if(cr)return codeForm(cr.dataset.codeType);

  if(cs)return changeCodeStatus(cs.dataset.codeId,cs.dataset.codeAction);

  if(e.target.id==='saveTrainingDay')return saveTrainingDay();
  if(e.target.id==='saveWorkoutBlock')return saveWorkoutBlock();
  if(e.target.id==='saveSubstitutions')return saveSubstitutions();

  }

  if(e.target.id==='logout'){await sb.auth.signOut();location.reload();return;}

  if(e.target.id==='passwordReset'){
    const u=(await sb.auth.getUser()).data.user;
    if(u?.email){await sb.auth.resetPasswordForEmail(u.email);alert('Reset email sent.');}
    return;
  }

  if(e.target.id==='saveAthlete'){
    const f=new FormData(document.getElementById('modalForm')),id=f.get('id');
    return save('athletes',{
      full_name:String(f.get('full_name')||'').trim(),
      display_name:String(f.get('display_name')||'').trim(),
      cohort_id:f.get('cohort_id')||null,

      last_name:String(f.get('last_name')||'').trim(),

      coach_note:String(f.get('coach_note')||'').trim()
    },id);
  }

  if(e.target.id==='saveCohort'){
    const f=new FormData(document.getElementById('modalForm')),id=f.get('id');
    const programmeId=String(f.get('programme_id')||'');
    const week=+f.get('current_week')||1;
    const status=String(f.get('status')||'draft');
    if(status==='live'&&!publishedWeekReady(programmeId,week)){
      const ok=confirm(`Week ${week} is not currently published and verified for this programme. Saving a live cohort in this state will make the Hub show that the programme is being prepared. Continue?`);
      if(!ok)return;
    }
    return save('cohorts',{
      name:String(f.get('name')||'').trim(),
      programme_id:programmeId||null,
      current_week:week,
      current_phase:String(f.get('current_phase')||'').trim(),
      expected_sessions_per_week:Math.min(7,Math.max(1,+f.get('expected_sessions_per_week')||3)),
      status,
      tier:String(f.get('tier')||'').trim()||null,
      internal_notes:String(f.get('internal_notes')||'').trim()
    },id);
  }

  if(e.target.id==='saveExercise'){
    const f=new FormData(document.getElementById('modalForm')),id=f.get('id'),vid=String(f.get('video_id')||'').trim();
    return save('exercises',{
      code:String(f.get('code')||'').trim().toUpperCase(),
      name:String(f.get('name')||'').trim(),
      category_slug:String(f.get('category_slug')||'').trim(),

      coaching_cues:String(f.get('coaching_cues')||'').trim(),

      active:true

async function authorisedAdmin(){
  const {data:{user},error:userError}=await sb.auth.getUser();
  if(userError||!user)return null;
  const {data,error}=await sb.from('admin_profiles').select('user_id,display_name').eq('user_id',user.id).maybeSingle();
  if(error||!data)return null;
  return data;
}


document.getElementById('forgotPassword').addEventListener('click',async ()=>{
  if(!configured){document.getElementById('setupNotice').classList.remove('hidden');return;}
  const emailValue=String(document.getElementById('email').value||'').trim();
  const loginErr=document.getElementById('loginErr');
  if(!emailValue){loginErr.textContent='Enter your admin email first, then choose Forgot password.';return;}
  loginErr.textContent='';
  const redirectTo=location.origin+location.pathname;
  const {error}=await sb.auth.resetPasswordForEmail(emailValue,{redirectTo});
  if(error){loginErr.textContent=error.message;return;}
  loginErr.style.color='#dcc38c';
  loginErr.textContent='Password reset email sent. Check your inbox.';
});


document.getElementById('recoveryForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=String(document.getElementById('newPassword').value||'');
  const confirmPw=String(document.getElementById('confirmPassword').value||'');
  const err=document.getElementById('recoveryErr');
  err.style.color='#ffb4b4';
  err.textContent='';
  if(pw.length<8){err.textContent='Use at least 8 characters.';return;}
  if(pw!==confirmPw){err.textContent='Passwords do not match.';return;}
  const {error}=await sb.auth.updateUser({password:pw});
  if(error){err.textContent=error.message;return;}
  err.style.color='#dcc38c';
  err.textContent='Password updated. Opening Control Room…';
  document.getElementById('recovery').classList.add('hidden');
  await init();
});

if(sb){
  sb.auth.onAuthStateChange(async (event)=>{
    if(event==='PASSWORD_RECOVERY'){
      document.getElementById('login').classList.add('hidden');
      document.getElementById('app').classList.add('hidden');
      document.getElementById('recovery').classList.remove('hidden');
    }
  });
}

document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!configured){document.getElementById('setupNotice').classList.remove('hidden');return;}
  const emailValue=document.getElementById('email').value;
  const passwordValue=document.getElementById('password').value;
  const loginErr=document.getElementById('loginErr');
  loginErr.textContent='';
  const {error}=await sb.auth.signInWithPassword({email:emailValue,password:passwordValue});
  if(error){loginErr.textContent=error.message;return;}
  const admin=await authorisedAdmin();
  if(!admin){
    await sb.auth.signOut();
    loginErr.textContent='This account is not authorised for the Du Airlines Control Room.';
    return;
  }
  await init();
});

async function init(){
  if(!configured){document.getElementById('setupNotice').classList.remove('hidden');return;}
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const admin=await authorisedAdmin();
  if(!admin){
    await sb.auth.signOut();
    document.getElementById('loginErr').textContent='This account is not authorised for the Du Airlines Control Room.';
    return;
  }
  state.admin=admin;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await load();
}
init();

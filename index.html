<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DU Airlines Admin</title>

<style>
:root{--ink:#091a12;--green:#0f271c;--panel:#143222;--lift:#1a3d2a;--gold:#c7a25a;--gold2:#dcc38c;--cream:#f3efe4;--sage:#94a89a;--hair:rgba(199,162,90,.2);font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--green);color:var(--cream)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.card{background:var(--panel);border:1px solid var(--hair);border-radius:14px;padding:22px}.login .card{width:min(440px,100%)}.brand{font-weight:800;letter-spacing:.16em}.brand span{color:var(--gold)}h1,h2,h3{margin:0 0 10px}.muted{color:var(--sage)}label{display:block;font-size:12px;color:var(--sage);margin:14px 0 6px}input,select,textarea{width:100%;background:var(--ink);color:var(--cream);border:1px solid var(--hair);border-radius:10px;padding:12px}.btn{border:0;border-radius:10px;padding:12px 15px;cursor:pointer;font-weight:700}.primary{background:var(--gold);color:var(--ink)}.ghost{background:transparent;color:var(--cream);border:1px solid var(--hair)}.danger{background:#5a2323;color:white}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{position:sticky;top:0;z-index:5;background:rgba(9,26,18,.96);border-bottom:1px solid var(--hair);padding:13px 18px;display:flex;justify-content:space-between;align-items:center}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 58px)}nav{background:var(--ink);padding:16px;border-right:1px solid var(--hair)}nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--sage);padding:12px;border-radius:9px;cursor:pointer}nav button.active,nav button:hover{background:var(--panel);color:var(--cream)}main{padding:22px;max-width:1300px;width:100%}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric strong{font-size:28px;color:var(--gold2)}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:15px 0;flex-wrap:wrap}.search{max-width:380px}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--hair);padding:15px;border-radius:12px}.item p{margin:4px 0 0;color:var(--sage);font-size:13px}.pill{padding:5px 9px;border:1px solid var(--hair);border-radius:999px;font-size:12px;color:var(--gold2)}dialog{width:min(680px,calc(100% - 28px));border:1px solid var(--hair);border-radius:14px;background:var(--panel);color:var(--cream);padding:0}dialog::backdrop{background:rgba(0,0,0,.72)}.modal{padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.wide{grid-column:1/-1}.code{font-family:ui-monospace,monospace;color:var(--gold2)}.notice{padding:12px;border:1px solid var(--hair);border-radius:10px;margin:12px 0;color:var(--sage)}@media(max-width:850px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--hair);padding:8px;position:sticky;top:58px;z-index:4}nav button{white-space:nowrap;width:auto}.grid{grid-template-columns:1fr 1fr}main{padding:16px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:520px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}.top .brand{font-size:12px}}
</style></head><body>
<section id="login" class="login"><div class="card"><div class="brand">DU AIRLINES <span>ADMIN</span></div><h1 style="margin-top:18px">Private Control Room</h1><p class="muted">Secure founder access. This page is never linked from the public website.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><p id="loginErr" style="color:#ffb4b4"></p><button class="btn primary" style="width:100%">Log in</button></form><div id="setupNotice" class="notice hidden">Supabase is not configured yet. Add your project values to <span class="code">config.js</span>.</div></div></section>
<section id="app" class="hidden"><header class="top"><div class="brand">DU AIRLINES <span>ADMIN</span></div><button id="logout" class="btn ghost">Log out</button></header><div class="layout"><nav id="nav"></nav><main id="main"></main></div></section>
<dialog id="modal"><form method="dialog" class="modal" id="modalForm"></form></dialog>
<script>
const env=window.DU_AIRLINES_ENV||{};const configured=!!(env.SUPABASE_URL&&env.SUPABASE_ANON_KEY);const sb=configured?window.supabase.createClient(env.SUPABASE_URL,env.SUPABASE_ANON_KEY):null;
const state={page:'dashboard',athletes:[],cohorts:[],staff:[],exercises:[],programmes:[],feedback:[],blocks:[],sessions:[]};
const pages=['dashboard','athletes','cohorts','staff','programmes','library','blocks','feedback','access','settings'];
const labels={dashboard:'Dashboard',athletes:'Athletes',cohorts:'Cohorts',staff:'Staff',programmes:'Programmes',library:'Exercise Library',blocks:'Saved Blocks',feedback:'Feedback',access:'Access',settings:'Settings'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function nav(){document.getElementById('nav').innerHTML=pages.map(p=>`<button data-page="${p}" class="${state.page===p?'active':''}">${labels[p]}</button>`).join('')}
async function load(){if(!sb)return;const qs=[['athletes','athletes'],['cohorts','cohorts'],['staff_profiles','staff'],['exercises','exercises'],['programmes','programmes'],['feedback','feedback'],['saved_blocks','blocks'],['hub_sessions','sessions']];for(const [table,key] of qs){const {data,error}=await sb.from(table).select('*').order('created_at',{ascending:false});if(!error)state[key]=data||[];}render();}
function metric(n,label){return `<div class="card metric"><strong>${n}</strong><div class="muted">${label}</div></div>`}
function render(){nav();const m=document.getElementById('main');if(state.page==='dashboard'){m.innerHTML=`<h1>Control Room</h1><p class="muted">What do you need to control today?</p><div class="grid">${metric(state.cohorts.filter(x=>x.status==='live').length,'Active Cohorts')}${metric(state.athletes.filter(x=>x.athlete_type==='private'&&x.access_status==='active').length,'Private Athletes')}${metric(state.athletes.filter(x=>x.athlete_type==='school'&&x.access_status==='active').length,'School Athletes')}${metric(state.feedback.filter(x=>x.status==='waiting').length,'Feedback Waiting')}</div><div class="toolbar"><h2>Quick Actions</h2></div><div class="grid"><button class="btn primary" data-add="athlete">Add Athlete</button><button class="btn ghost" data-add="cohort">Create Cohort</button><button class="btn ghost" data-add="exercise">Add Exercise</button><button class="btn ghost" data-page="feedback">Review Feedback</button></div>`;return;}
if(state.page==='athletes')return renderAthletes(m);if(state.page==='cohorts')return renderCohorts(m);if(state.page==='library')return renderLibrary(m);if(state.page==='feedback')return renderFeedback(m);if(state.page==='access')return renderAccess(m);if(state.page==='staff')return renderSimple(m,'Staff',state.staff,x=>`${esc(x.full_name)}<p>${esc(x.role_title||'Coach / Staff')} · ${esc(x.access_status)}</p>`,'staff');if(state.page==='programmes')return renderSimple(m,'Programmes',state.programmes,x=>`${esc(x.name)}<p>${x.duration_weeks||10} weeks · ${esc(x.status)}</p>`,'programme');if(state.page==='blocks')return renderSimple(m,'Saved Blocks',state.blocks,x=>`${esc(x.name)}<p>${esc(x.description||'Reusable programme block')}</p>`,'block');if(state.page==='settings'){m.innerHTML='<h1>Settings</h1><div class="card"><h3>Admin account</h3><p class="muted">Password reset and account security are handled by Supabase Auth.</p><button class="btn ghost" id="passwordReset">Send password reset email</button></div>';return;}}
function renderSimple(m,title,rows,fmt,type){m.innerHTML=`<div class="toolbar"><div><h1>${title}</h1><p class="muted">${rows.length} records</p></div><button class="btn primary" data-add="${type}">Add ${title.replace(/s$/,'')}</button></div><div class="list">${rows.map(x=>`<div class="item"><div><strong>${fmt(x)}</strong></div><span class="pill">${esc(x.status||x.access_status||'Active')}</span></div>`).join('')||'<div class="card muted">No records yet.</div>'}</div>`}
function renderAthletes(m){m.innerHTML=`<div class="toolbar"><div><h1>Athletes</h1><p class="muted">Edit identity, week, programme and access without touching code.</p></div><button class="btn primary" data-add="athlete">Add Athlete</button></div><input class="search" id="search" placeholder="Search athlete…"><div class="list" id="athleteList">${athleteRows(state.athletes)}</div>`}
function athleteRows(rows){return rows.map(a=>`<div class="item" data-search="${esc((a.full_name+' '+(a.events||[]).join(' ')).toLowerCase())}"><div><strong>${esc(a.full_name)}</strong><p>${esc(a.athlete_type)} · Week ${a.current_week||1} · ${esc((a.events||[]).join(', ')||'Event not set')}</p></div><div class="row"><span class="pill">${esc(a.access_status)}</span><button class="btn ghost" data-edit-athlete="${a.id}">Edit</button></div></div>`).join('')||'<div class="card muted">No athletes yet.</div>'}
function renderCohorts(m){m.innerHTML=`<div class="toolbar"><div><h1>Cohorts</h1><p class="muted">Schools and grouped development pathways.</p></div><button class="btn primary" data-add="cohort">Create Cohort</button></div><div class="list">${state.cohorts.map(c=>`<div class="item"><div><strong>${esc(c.name)}</strong><p>Week ${c.current_week||1} · ${esc(c.current_phase||'Phase not set')}</p></div><div class="row"><span class="pill">${esc(c.status)}</span><button class="btn ghost" data-edit-cohort="${c.id}">Edit</button></div></div>`).join('')||'<div class="card muted">No cohorts yet.</div>'}</div>`}
function renderLibrary(m){m.innerHTML=`<div class="toolbar"><div><h1>Exercise Library</h1><p class="muted">Permanent codes. Update a video once; linked sessions keep the reference.</p></div><button class="btn primary" data-add="exercise">Add Exercise</button></div><input class="search" id="search" placeholder="Search ACT02, PLY, glute…"><div class="list" id="exerciseList">${exerciseRows(state.exercises)}</div>`}
function exerciseRows(rows){return rows.map(e=>`<div class="item" data-search="${esc((e.code+' '+e.name+' '+(e.category_slug||'')).toLowerCase())}"><div><strong><span class="code">${esc(e.code)}</span> — ${esc(e.name)}</strong><p>${esc(e.purpose||e.category_slug||'')}</p></div><button class="btn ghost" data-edit-exercise="${e.id}">Edit</button></div>`).join('')||'<div class="card muted">No exercises yet.</div>'}
function renderFeedback(m){m.innerHTML=`<h1>Feedback Waiting</h1><p class="muted">Low-friction athlete and coach checkpoints.</p><div class="list">${state.feedback.map(f=>`<div class="item"><div><strong>${esc(f.feedback_type)} feedback · Week ${f.week_number||'-'}</strong><p>${esc(JSON.stringify(f.payload||{}).slice(0,160))}</p></div><div class="row"><span class="pill">${esc(f.status)}</span>${f.status==='waiting'?`<button class="btn ghost" data-review="${f.id}">Mark Reviewed</button>`:''}</div></div>`).join('')||'<div class="card muted">Nothing waiting.</div>'}</div>`}
function renderAccess(m){m.innerHTML=`<h1>Access Management</h1><p class="muted">Create access codes by storing only their SHA-256 hash. Raw codes are shown only when you create them.</p><div class="grid"><button class="btn primary" data-code-type="cohort">New Cohort Code</button><button class="btn ghost" data-code-type="staff">New Staff Code</button><button class="btn ghost" data-code-type="private_athlete">New Private Athlete Code</button></div><div class="notice">Session revoke controls are backed by the <span class="code">hub_sessions</span> table. ${state.sessions.length} sessions currently stored.</div>`}
function openModal(html){const d=document.getElementById('modal'),f=document.getElementById('modalForm');f.innerHTML=html;d.showModal()}
function athleteForm(a={}){openModal(`<h2>${a.id?'Edit':'Add'} Athlete</h2><div class="formgrid"><label>Full registered name<input name="full_name" required value="${esc(a.full_name||'')}"></label><label>Display first name<input name="display_name" required value="${esc(a.display_name||'')}"></label><label>Type<select name="athlete_type"><option value="school" ${a.athlete_type==='school'?'selected':''}>School</option><option value="private" ${a.athlete_type==='private'?'selected':''}>Private</option></select></label><label>Form / Tier<input name="form_tier" value="${esc(a.form_tier||'')}"></label><label>Events (comma separated)<input name="events" value="${esc((a.events||[]).join(', '))}"></label><label>Current Week<input name="current_week" type="number" min="1" max="52" value="${a.current_week||1}"></label><label>Current Phase<input name="current_phase" value="${esc(a.current_phase||'')}"></label><label>Access<select name="access_status"><option>active</option><option ${a.access_status==='paused'?'selected':''}>paused</option><option ${a.access_status==='archived'?'selected':''}>archived</option></select></label><label class="wide">Admin-only notes<textarea name="admin_notes">${esc(a.admin_notes||'')}</textarea></label></div><input type="hidden" name="id" value="${a.id||''}"><div class="row" style="margin-top:18px"><button value="cancel" class="btn ghost">Cancel</button><button type="button" class="btn primary" id="saveAthlete">Save Athlete</button></div>`)}
function cohortForm(c={}){openModal(`<h2>${c.id?'Edit':'Create'} Cohort</h2><div class="formgrid"><label class="wide">Cohort Name<input name="name" required value="${esc(c.name||'')}"></label><label>Current Week<input name="current_week" type="number" min="1" value="${c.current_week||1}"></label><label>Phase<input name="current_phase" value="${esc(c.current_phase||'')}"></label><label>Status<select name="status">${['draft','scheduled','live','completed','paused','archived'].map(x=>`<option ${c.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Tier<input name="tier" value="${esc(c.tier||'')}"></label><label class="wide">Internal notes<textarea name="internal_notes">${esc(c.internal_notes||'')}</textarea></label></div><input type="hidden" name="id" value="${c.id||''}"><div class="row" style="margin-top:18px"><button value="cancel" class="btn ghost">Cancel</button><button type="button" class="btn primary" id="saveCohort">Save Cohort</button></div>`)}
function exerciseForm(e={}){openModal(`<h2>${e.id?'Edit':'Add'} Exercise</h2><div class="formgrid"><label>Code<input name="code" required value="${esc(e.code||'')}"></label><label>Name<input name="name" required value="${esc(e.name||'')}"></label><label>Category / prefix<input name="category_slug" value="${esc(e.category_slug||'')}"></label><label>Video ID<input name="video_id" value="${esc(e.video_id||'')}"></label><label class="wide">Purpose<input name="purpose" value="${esc(e.purpose||'')}"></label><label class="wide">Coaching cues<textarea name="coaching_cues">${esc(e.coaching_cues||'')}</textarea></label><label class="wide">Default dosage<input name="default_dosage" value="${esc(e.default_dosage||'')}"></label></div><input type="hidden" name="id" value="${e.id||''}"><div class="row" style="margin-top:18px"><button value="cancel" class="btn ghost">Cancel</button><button type="button" class="btn primary" id="saveExercise">Save Exercise</button></div>`)}
async function save(table,obj,id){let q=id?sb.from(table).update(obj).eq('id',id):sb.from(table).insert(obj);const {error}=await q;if(error)alert(error.message);else{document.getElementById('modal').close();await load()}}
function codeForm(type){
  const isCohort=type==='cohort',isStaff=type==='staff';
  const rows=isCohort?state.cohorts:(isStaff?state.staff:state.athletes.filter(a=>a.athlete_type==='private'));
  const label=isCohort?'Cohort':(isStaff?'Staff member':'Private athlete');
  if(!rows.length){alert('Create a '+label.toLowerCase()+' first, then come back here.');return;}
  const options=rows.map(x=>`<option value="${esc(x.id)}">${esc(x.name||x.full_name||x.display_name||'Unnamed')}</option>`).join('');
  openModal(`<h2>Create ${label} Access Code</h2><p class="muted">No UUIDs needed. Just choose who the code belongs to and type the code you want them to use.</p><div class="formgrid"><label class="wide">Choose ${label}<select name="target_id" required>${options}</select></label><label class="wide">Access code<input name="raw_code" required autocomplete="off" placeholder="Example: DRAGON26"></label></div><input type="hidden" name="code_type" value="${type}"><div class="notice">You choose the code. After saving, the database stores only a secure hash — not the readable code.</div><div class="row" style="margin-top:18px"><button value="cancel" class="btn ghost">Cancel</button><button type="button" class="btn primary" id="saveAccessCode">Create Code</button></div>`)
}
async function saveAccessCode(){
  const f=new FormData(document.getElementById('modalForm')),type=f.get('code_type'),target=f.get('target_id'),raw=String(f.get('raw_code')||'').trim();
  if(!target||!raw){alert('Choose a person/cohort and enter an access code.');return;}
  const bytes=new TextEncoder().encode(raw.toLowerCase()),digest=await crypto.subtle.digest('SHA-256',bytes),hash=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
  const row={code_type:type,code_hash:hash,status:'active'};
  if(type==='cohort')row.cohort_id=target;if(type==='staff')row.staff_id=target;if(type==='private_athlete')row.athlete_id=target;
  const {error}=await sb.from('access_codes').insert(row);
  if(error){alert(error.message);return;}
  document.getElementById('modal').close();
  alert('Access code created ✅\n\nCode: '+raw+'\n\nSave/share this exact code with the right athlete or staff member.');
}
document.addEventListener('click',async e=>{const p=e.target.closest('[data-page]');if(p){state.page=p.dataset.page;render();return}const add=e.target.closest('[data-add]');if(add){if(add.dataset.add==='athlete')athleteForm();else if(add.dataset.add==='cohort')cohortForm();else if(add.dataset.add==='exercise')exerciseForm();else alert('The database supports this record type; UI editor can be added next.');return}const ae=e.target.closest('[data-edit-athlete]');if(ae)return athleteForm(state.athletes.find(x=>x.id===ae.dataset.editAthlete)||{});const ce=e.target.closest('[data-edit-cohort]');if(ce)return cohortForm(state.cohorts.find(x=>x.id===ce.dataset.editCohort)||{});const ee=e.target.closest('[data-edit-exercise]');if(ee)return exerciseForm(state.exercises.find(x=>x.id===ee.dataset.editExercise)||{});const cr=e.target.closest('[data-code-type]');if(cr)return codeForm(cr.dataset.codeType);if(e.target.id==='saveAccessCode')return saveAccessCode();const rv=e.target.closest('[data-review]');if(rv){await sb.from('feedback').update({status:'reviewed',reviewed_at:new Date().toISOString()}).eq('id',rv.dataset.review);return load()}if(e.target.id==='logout'){await sb.auth.signOut();location.reload()}if(e.target.id==='passwordReset'){const u=(await sb.auth.getUser()).data.user; if(u?.email){await sb.auth.resetPasswordForEmail(u.email);alert('Reset email sent.')}}if(e.target.id==='saveAthlete'){const f=new FormData(document.getElementById('modalForm')),id=f.get('id');return save('athletes',{full_name:f.get('full_name'),display_name:f.get('display_name'),athlete_type:f.get('athlete_type'),form_tier:f.get('form_tier'),events:String(f.get('events')||'').split(',').map(x=>x.trim()).filter(Boolean),current_week:+f.get('current_week')||1,current_phase:f.get('current_phase'),access_status:f.get('access_status'),admin_notes:f.get('admin_notes')},id)}if(e.target.id==='saveCohort'){const f=new FormData(document.getElementById('modalForm')),id=f.get('id');return save('cohorts',{name:f.get('name'),current_week:+f.get('current_week')||1,current_phase:f.get('current_phase'),status:f.get('status'),tier:f.get('tier'),internal_notes:f.get('internal_notes')},id)}if(e.target.id==='saveExercise'){const f=new FormData(document.getElementById('modalForm')),id=f.get('id'),vid=f.get('video_id');return save('exercises',{code:String(f.get('code')).toUpperCase(),name:f.get('name'),category_slug:f.get('category_slug'),video_id:vid,video_url:vid?'https://www.youtube.com/shorts/'+vid:'',purpose:f.get('purpose'),coaching_cues:f.get('coaching_cues'),default_dosage:f.get('default_dosage'),active:true},id)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-search]').forEach(x=>x.style.display=x.dataset.search.includes(q)?'grid':'none')}});
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!configured){document.getElementById('setupNotice').classList.remove('hidden');return}const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)loginErr.textContent=error.message;else init()});
async function init(){if(!configured){document.getElementById('setupNotice').classList.remove('hidden');return}const {data:{session}}=await sb.auth.getSession();if(!session)return;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await load()}
init();
</script></body></html>

gin:15px 0;flex-wrap:wrap}.search{max-width:380px}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--hair);padding:15px;border-radius:12px}.item p{margin:4px 0 0;color:var(--sage);font-size:13px}.pill{padding:5px 9px;border:1px solid var(--hair);border-radius:999px;font-size:12px;color:var(--gold2)}dialog{width:min(680px,calc(100% - 28px));border:1px solid var(--hair);border-radius:14px;background:var(--panel);color:var(--cream);padding:0}dialog::backdrop{background:rgba(0,0,0,.72)}.modal{padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.wide{grid-column:1/-1}.code{font-family:ui-monospace,monospace;color:var(--gold2)}.notice{padding:12px;border:1px solid var(--hair);border-radius:10px;margin:12px 0;color:var(--sage)}@media(max-width:850px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--hair);padding:8px;position:sticky;top:58px;z-index:4}nav button{white-space:nowrap;width:auto}.grid{grid-template-columns:1fr 1fr}main{padding:16px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:520px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}.top .brand{font-size:12px}}
</style></head><body>
<section id="login" class="login"><div class="card"><div class="brand">DU AIRLINES <span>ADMIN</span></div><h1 style="margin-top:18px">Private Control Room</h1><p class="muted">Secure founder access. This page is never linked from the public website.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><p id="loginErr" style="color:#ffb4b4"></p><button class="btn primary" style="width:100%">Log in</button></form><div id="setupNotice" class="notice hidden">Supabase is not configured yet. Add your project values to <span class="code">config.js</span>.</div></div></section>
<section id="app" class="hidden"><header class="top"><div class="brand">DU AIRLINES <span>ADMIN</span></div><button id="logout" class="btn ghost">Log out</button></header><div class="layout"><nav id="nav"></nav><main id="main"></main></div></section>
<dialog id="modal"><form method="dialog" class="modal" id="modalForm"></form></dialog>
<script>

const env=window.DU_AIRLINES_ENV||{};
const configured=!!(env.SUPABASE_URL&&env.SUPABASE_ANON_KEY);
const sb=configured?window.supabase.createClient(env.SUPABASE_URL,env.SUPABASE_ANON_KEY):null;

const state={
  page:'dashboard',
  admin:null,
  athletes:[],
  professionals:[],
  cohorts:[],
  staff:[],
  exercises:[],
  programmes:[],
  programmeWeeks:[],
  programmeTiers:[],
  trainingDays:[],
  sessionBlocks:[],
  feedback:[],
  blocks:[],
  sessions:[],
  accessCodes:[],
  programmeContext:null,
  loadErrors:[]
};

const pages=['dashboard','athletes','professionals','cohorts','staff','programmes','library','blocks','feedback','access','settings'];
const labels={
  dashboard:'Dashboard',
  athletes:'Athletes',
  professionals:'Professionals',
  cohorts:'Cohorts',
  staff:'Staff',
  programmes:'Programmes',
  library:'Exercise Library',
  blocks:'Saved Blocks',
  feedback:'Feedback',
  access:'Access',
  settings:'Settings'
};

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmtDate=v=>v?new Date(v).toLocaleString():'—';
const byId=(rows,id)=>rows.find(x=>x.id===id);
const cohortFor=id=>byId(state.cohorts,id);
const cohortName=id=>cohortFor(id)?.name||'Not assigned';
const programmeName=id=>byId(state.programmes,id)?.name||'Not assigned';
const activeAccount=a=>a?.access_status==='active';
const isPrivateAthlete=a=>!!a?.athlete_user_id;
const isParentManaged=a=>!!a?.parent_user_id;
const athleteKind=a=>isParentManaged(a)?'Parent-managed':isPrivateAthlete(a)?'Private Athlete':'School / legacy profile';
const feedbackNeedsReview=f=>f.status!=='no_change'&&!f.reviewed_at;
const feedbackLabel=f=>{
  if(f.status==='adjustment_flagged')return 'Adjustment flagged';
  if(f.status==='reviewed')return 'Review';
  if(f.status==='waiting')return 'Waiting';
  if(f.status==='no_change')return 'No change';
  return f.status||'Unknown';
};

function nav(){
  document.getElementById('nav').innerHTML=pages.map(p=>`<button data-page="${p}" class="${state.page===p?'active':''}">${labels[p]}</button>`).join('');
}

async function tableRows(table,key,order='created_at'){
  const {data,error}=await sb.from(table).select('*').order(order,{ascending:false});
  if(error){
    state.loadErrors.push(`${table}: ${error.message}`);
    state[key]=[];
    return;
  }
  state[key]=data||[];
}

async function load(){
  if(!sb)return;
  state.loadErrors=[];
  await Promise.all([
    tableRows('athletes','athletes'),
    tableRows('professional_members','professionals'),
    tableRows('cohorts','cohorts'),
    tableRows('staff_profiles','staff'),
    tableRows('exercises','exercises'),
    tableRows('programmes','programmes'),
    tableRows('programme_weeks','programmeWeeks'),
    tableRows('programme_tiers','programmeTiers','sort_order'),
    tableRows('training_days','trainingDays','sort_order'),
    tableRows('session_blocks','sessionBlocks','sort_order'),
    tableRows('feedback','feedback'),
    tableRows('saved_blocks','blocks'),
    tableRows('hub_sessions','sessions'),
    tableRows('access_codes','accessCodes')
  ]);
  render();
}

function metric(n,label){return `<div class="card metric"><strong>${n}</strong><div class="muted">${label}</div></div>`}
function loadWarning(){
  return state.loadErrors.length?`<div class="notice" style="color:#ffcf9f">Some admin data could not load. Nothing was changed. ${esc(state.loadErrors.join(' | '))}</div>`:'';
}

function render(){
  nav();
  const m=document.getElementById('main');
  if(state.page==='dashboard'){
    const activeCohorts=state.cohorts.filter(x=>x.status==='live').length;
    const privateAthletes=state.athletes.filter(a=>isPrivateAthlete(a)&&activeAccount(a)).length;
    const parentAthletes=state.athletes.filter(a=>isParentManaged(a)&&activeAccount(a)).length;
    const professionals=state.professionals.filter(p=>p.access_status==='active').length;
    const feedbackReview=state.feedback.filter(feedbackNeedsReview).length;
    const sharedCodes=state.accessCodes.filter(c=>c.status==='active'&&(c.code_type==='cohort'||c.code_type==='staff')).length;
    m.innerHTML=`${loadWarning()}<h1>Control Room</h1><p class="muted">Live operations view from the same Supabase data used by the Performance Hub.</p>
    <div class="grid">
      ${metric(activeCohorts,'Active Cohorts')}
      ${metric(privateAthletes,'Private Athlete Accounts')}
      ${metric(parentAthletes,'Parent-Managed Athletes')}
      ${metric(professionals,'Professional Members')}
      ${metric(feedbackReview,'Feedback Needs Review')}
      ${metric(sharedCodes,'Active Shared Codes')}
    </div>
    <div class="toolbar"><h2>Quick Actions</h2></div>
    <div class="grid">
      <button class="btn primary" data-page="feedback">Review Feedback</button>
      <button class="btn ghost" data-page="cohorts">Manage Cohorts</button>
      <button class="btn ghost" data-page="library">Exercise Library</button>
      <button class="btn ghost" data-page="access">Manage Access</button>
    </div>`;
    return;
  }
  if(state.page==='athletes')return renderAthletes(m);
  if(state.page==='professionals')return renderProfessionals(m);
  if(state.page==='cohorts')return renderCohorts(m);
  if(state.page==='library')return renderLibrary(m);
  if(state.page==='feedback')return renderFeedback(m);
  if(state.page==='access')return renderAccess(m);
  if(state.page==='staff')return renderStaff(m);
  if(state.page==='programmes')return renderProgrammes(m);
  if(state.page==='programme-editor')return renderProgrammeEditor(m);
  if(state.page==='blocks')return renderBlocks(m);
  if(state.page==='settings')return renderSettings(m);
}

function renderAthletes(m){
  m.innerHTML=`${loadWarning()}<div class="toolbar"><div><h1>Athletes</h1><p class="muted">Account records are created through the existing onboarding flows. Manage cohort assignment, coach notes and safe access actions here.</p></div></div>
  <input class="search" id="search" placeholder="Search athlete…">
  <div class="list" id="athleteList">${athleteRows(state.athletes)}</div>`;
}

function athleteRows(rows){
  return rows.map(a=>{
    const cohort=cohortFor(a.cohort_id);
    const week=cohort?.current_week?`Week ${cohort.current_week}`:'No live week';
    const kind=athleteKind(a);
    const onboarding=(a.parent_user_id||a.athlete_user_id)?(a.onboarding_complete?'Onboarding complete':'Onboarding pending'):'Shared/legacy record';
    const actions=(a.parent_user_id||a.athlete_user_id)?accessButtons('athlete',a):'';
    return `<div class="item" data-search="${esc(((a.full_name||'')+' '+kind+' '+(cohort?.name||'')).toLowerCase())}">
      <div><strong>${esc(a.full_name||a.display_name||'Unnamed athlete')}</strong>
      <p>${esc(kind)} · ${esc(cohort?.name||'Not assigned')} · ${esc(week)} · ${esc(onboarding)}</p></div>
      <div class="row"><span class="pill">${esc(a.access_status||'pending')}</span>${a.cohort_id?`<button class="btn ghost" data-programme-context="athlete" data-programme-id="${a.id}">Current Programme</button>`:''}${(a.parent_user_id||a.athlete_user_id)?`<button class="btn ghost" data-substitutions="${a.id}">Exercise Swap</button>`:''}<button class="btn ghost" data-edit-athlete="${a.id}">Manage</button>${actions}</div>
    </div>`;
  }).join('')||'<div class="card muted">No athletes yet.</div>';
}

function renderProfessionals(m){
  m.innerHTML=`${loadWarning()}<div class="toolbar"><div><h1>Professional Members</h1><p class="muted">Professional Performance account access and cohort assignment.</p></div></div>
  <div class="list">${state.professionals.map(p=>{
    const cohort=cohortFor(p.cohort_id);
    return `<div class="item"><div><strong>${esc([p.first_name,p.last_name].filter(Boolean).join(' ')||p.email||'Unnamed member')}</strong>
    <p>${esc(p.email||'')} · ${esc(cohort?.name||'Not assigned')} · ${cohort?.current_week?'Week '+cohort.current_week:'No live week'} · ${p.onboarding_complete?'Onboarding complete':'Onboarding pending'}</p></div>
    <div class="row"><span class="pill">${esc(p.access_status||'pending')}</span>${p.cohort_id?`<button class="btn ghost" data-programme-context="professional" data-programme-id="${p.id}">Current Programme</button>`:''}<button class="btn ghost" data-edit-professional="${p.id}">Manage</button>${accessButtons('professional',p)}</div></div>`;
  }).join('')||'<div class="card muted">No professional members yet.</div>'}</div>`;
}

function accessButtons(kind,row){
  if(row.access_status==='pending')return `<button class="btn ghost" data-access-kind="${kind}" data-access-id="${row.id}" data-access-action="activate">Activate Complimentary</button>`;
  if(row.access_status==='active')return `<button class="btn ghost" data-access-kind="${kind}" data-access-id="${row.id}" data-access-action="pause">Pause</button>`;
  if(row.access_status==='paused')return `<button class="btn ghost" data-access-kind="${kind}" data-access-id="${row.id}" data-access-action="resume">Resume</button>`;
  return '';
}

function cohortOptions(selected=''){
  return `<option value="">Not assigned</option>`+state.cohorts.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)} — Week ${c.current_week||1}</option>`).join('');
}

function athleteForm(a={}){
  openModal(`<h2>Manage Athlete</h2>
  <p class="muted">The cohort is the source of truth for the athlete's current week. This screen does not maintain a separate athlete week.</p>
  <div class="formgrid">
    <label>Full registered name<input name="full_name" required value="${esc(a.full_name||'')}"></label>
    <label>Display first name<input name="display_name" required value="${esc(a.display_name||'')}"></label>
    <label class="wide">Assigned cohort<select name="cohort_id">${cohortOptions(a.cohort_id||'')}</select></label>
    <label class="wide">Coach note<textarea name="coach_note">${esc(a.coach_note||'')}</textarea></label>
  </div>
  <input type="hidden" name="id" value="${a.id||''}">
  <div class="notice">Access: ${esc(a.access_status||'pending')} · Reason: ${esc(a.access_reason||'not set')} · Payment: ${esc(a.payment_status||'pending')}</div>
  <div class="row" style="margin-top:18px"><button value="cancel" class="btn ghost">Cancel</button><button type="button" class="btn primary" id="saveAthlete">Save Assignment</button></div>`);
}

function professionalForm(p={}){
  openModal(`<h2>Manage Professional</h2>
  <div class="formgrid">
    <label>First name<input name="first_name" value="${esc(p.first_name||'')}"></label>
    <label>Last name<input name="last_name" value="${esc(p.last_name||'')}"></label>
    <label class="wide">Assigned cohort<select name="cohort_id">${cohortOptions(p.cohort_id||'')}</select></label>
    <label class="wide">Coach note<textarea name="coach_note">${esc(p.coach_note||'')}</textarea></label>
  </div>
  <input type="hidden" name="id" value="${p.id||''}">
  <div class="notice">Access: ${esc(p.access_status||'pending')} · Reason: ${esc(p.access_reason||'not set')} · Payment: ${esc(p.payment_status||'pending')}</div>
  <div class="row" style="margin-top:18px"><button value="cancel" class="btn ghost">Cancel</button><button type="button" class="btn primary" id="saveProfessional">Save Assignment</button></div>`);
}

function renderCohorts(m){
  m.innerHTML=`${loadWarning()}<div class="toolbar"><div><h1>Cohorts</h1><p class="muted">This is the source of truth for programme assignment and current week.</p></div><button class="btn primary" data-add="cohort">Create Cohort</button></div>
  <div class="list">${state.cohorts.map(c=>`<div class="item"><div><strong>${esc(c.name)}</strong>
  <p>${esc(programmeName(c.programme_id))} · Week ${c.current_week||1} · ${esc(c.current_phase||'Phase not set')} · ${c.expected_sessions_per_week||'—'} sessions/week</p></div>
  <div class="row"><span class="pill">${esc(c.status)}</span><button class="btn ghost" data-programme-context="cohort" data-programme-id="${c.id}">Current Programme</button><button class="btn ghost" data-edit-cohort="${c.id}">Edit</button></div></div>`).join('')||'<div class="card muted">No cohorts yet.</div>'}</div>`;
}

function programmeOptions(selected=''){
  return `<option value="">Choose programme</option>`+state.programmes.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('');
}

function cohortForm(c={}){
  openModal(`<h2>${c.id?'Edit':'Create'} Cohort</h2>
  <div class="formgrid">
    <label class="wide">Cohort Name<input name="name" required value="${esc(c.name||'')}"></label>
    <label class="wide">Programme<select name="programme_id" required>${programmeOptions(c.programme_id||'')}</select></label>
    <label>Current Week<input name="current_week" type="number" min="1" max="52" value="${c.current_week||1}"></label>
    <label>Phase<input name="current_phase" value="${esc(c.current_phase||'')}"></label>
    <label>Expected sessions / week<input name="expected_sessions_per_week" type="number" min="1" max="7" value="${c.expected_sessions_per_week||3}"></label>
    <label>Status<select name="status">${['draft','scheduled','live','completed','paused','archived'].map(x=>`<option ${c.status===x?'selected':''}>${x}</option>`).join('')}</select></label>
    <label>Tier<input name="tier" value="${esc(c.tier||'')}"></label>
    <label class="wide">Internal notes<textarea name="internal_notes">${esc(c.internal_notes||'')}</textarea></label>
  </div>
  <input type="hidden" name="id" value="${c.id||''}">
  <div class="notice">Changing Current Week changes what this cohort receives in the Hub. A live cohort only displays a week that is published and verified.</div>
  <div class="row" style="margin-top:18px"><button value="cancel" class="btn ghost">Cancel</button><button type="button" class="btn primary" id="saveCohort">Save Cohort</button></div>`);
}


function contextDetails(){
  const ctx=state.programmeContext;
  if(!ctx)return null;
  let cohort=null,label='',account=null;
  if(ctx.type==='cohort'){
    cohort=byId(state.cohorts,ctx.id);
    label=cohort?.name||'Cohort';
  }else if(ctx.type==='athlete'){
    account=byId(state.athletes,ctx.id);
    cohort=cohortFor(account?.cohort_id);
    label=account?.full_name||account?.display_name||'Athlete';
  }else if(ctx.type==='professional'){
    account=byId(state.professionals,ctx.id);
    cohort=cohortFor(account?.cohort_id);
    label=[account?.first_name,account?.last_name].filter(Boolean).join(' ')||account?.email||'Professional';
  }
  if(!cohort)return null;
  return {ctx,cohort,label,account};
}

function weekForCohort(cohort){
  if(!cohort?.programme_id)return null;
  const candidates=state.programmeWeeks.filter(w=>w.programme_id===cohort.programme_id&&w.week_number===cohort.current_week);
  if(!candidates.length)return null;
  if(cohort.tier){
    const tier=state.programmeTiers.find(t=>t.programme_id===cohort.programme_id&&String(t.name||'').toLowerCase()===String(cohort.tier||'').toLowerCase());
    if(tier){
      const exact=candidates.find(w=>w.tier_id===tier.id);
      if(exact)return exact;
    }
  }
  return candidates.find(w=>!w.tier_id)||candidates[0];
}

function membersInCohort(cohortId){
  return state.athletes.filter(a=>a.cohort_id===cohortId).length+state.professionals.filter(p=>p.cohort_id===cohortId).length;
}

function playlistIdFromUrl(url){
  if(!url)return '';
  try{
    const u=new URL(url);
    if(!/(^|\.)youtube\.com$/i.test(u.hostname))return '';
    return u.searchParams.get('list')||'';
  }catch{return '';}
}

function blocksForDay(dayId){
  return state.sessionBlocks.filter(b=>b.training_day_id===dayId).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
}

function prescriptionEditor(block){
  const content=block.content||{};
  const prescriptions=Array.isArray(content.prescriptions)?content.prescriptions:[];
  if(prescriptions.length){
    return `<div class="list">${prescriptions.map((p,i)=>`<div class="card" style="padding:12px">
      <div class="formgrid">
        <label>Exercise code<input data-prescription-field="exerciseCode" data-prescription-index="${i}" value="${esc(p.exerciseCode||'')}"></label>
        <label>Dosage<input data-prescription-field="dosage" data-prescription-index="${i}" value="${esc(p.dosage||'')}"></label>
        <label>Rest<input data-prescription-field="rest" data-prescription-index="${i}" value="${esc(p.rest||'')}"></label>
        <label>Equipment<input data-prescription-field="equipment" data-prescription-index="${i}" value="${esc(p.equipment||'')}"></label>
        <label class="wide">Cues<input data-prescription-field="cues" data-prescription-index="${i}" value="${esc(p.cues||'')}"></label>
        <label class="wide">Alternative exercise code<input data-prescription-field="alternativeExerciseCode" data-prescription-index="${i}" value="${esc(p.alternativeExerciseCode||'')}"></label>
      </div>
    </div>`).join('')}</div>`;
  }
  const items=Array.isArray(content.items)?content.items:[];
  return `<label class="wide">Workout prescription — one line per item<textarea id="blockItems" rows="8">${esc(items.join('\n'))}</textarea></label>`;
}

function blockEditor(block){
  const content=block.content||{};
  openModal(`<h2>Edit ${esc(block.title||'Workout Block')}</h2>
  <p class="muted">Small current-week edits only. This updates the live programme block stored in Supabase.</p>
  <div class="formgrid">
    <label class="wide">Block title<input id="blockTitle" value="${esc(block.title||'')}"></label>
    <label class="wide">Focus<input id="blockFocus" value="${esc(content.focus||'')}"></label>
    <label class="wide">Requirement<input id="blockRequirement" value="${esc(content.requirement||'')}"></label>
    <label class="wide">Why<input id="blockWhy" value="${esc(content.why||'')}"></label>
    <label class="wide">Watch / coaching emphasis<input id="blockWatch" value="${esc(content.watch||'')}"></label>
    ${prescriptionEditor(block)}
    <label class="wide">Athlete note<textarea id="blockAthleteNote" rows="3">${esc(block.athlete_note||'')}</textarea></label>
  </div>
  <input type="hidden" id="editBlockId" value="${block.id}">
  <div class="notice">The original JSON structure is preserved; only the fields shown above are changed.</div>
  <div class="row" style="margin-top:18px"><button value="cancel" class="btn ghost">Cancel</button><button type="button" class="btn primary" id="saveWorkoutBlock">Save Workout Update</button></div>`);

async function saveWorkoutBlock(){
  const id=document.getElementById('editBlockId').value;
  const block=byId(state.sessionBlocks,id);
  if(!block)return;
  const content={...(block.content||{})};
  content.focus=String(document.getElementById('blockFocus').value||'').trim();
  content.requirement=String(document.getElementById('blockRequirement').value||'').trim();
  const why=String(document.getElementById('blockWhy').value||'').trim();
  const watch=String(document.getElementById('blockWatch').value||'').trim();
  if(why)content.why=why;else delete content.why;
  if(watch)content.watch=watch;else delete content.watch;

  const prescriptionInputs=[...document.querySelectorAll('[data-prescription-field]')];
  if(prescriptionInputs.length){
    const prescriptions=Array.isArray(content.prescriptions)?content.prescriptions.map(p=>({...p})):[];
    for(const input of prescriptionInputs){
      const i=+input.dataset.prescriptionIndex;
      const field=input.dataset.prescriptionField;
      if(!prescriptions[i])prescriptions[i]={};
      prescriptions[i][field]=String(input.value||'').trim();
    }
    content.prescriptions=prescriptions;
    if(Array.isArray(content.exerciseCodes)){
      content.exerciseCodes=prescriptions.map(p=>p.exerciseCode).filter(Boolean);
    }
  }else{
    const itemsBox=document.getElementById('blockItems');
    if(itemsBox)content.items=String(itemsBox.value||'').split('\n').map(x=>x.trim()).filter(Boolean);
  }

  const update={
    title:String(document.getElementById('blockTitle').value||'').trim(),
    athlete_note:String(document.getElementById('blockAthleteNote').value||'').trim(),
    content
  };
  const ok=confirm('Save this workout tweak to Supabase? This edits the current programme block and can appear in the Hub on reload.');
  if(!ok)return;
  const {error}=await sb.from('session_blocks').update(update).eq('id',id);
  if(error){alert(error.message);return;}
  document.getElementById('modal').close();
  await load();
}

async function saveSubstitutions(){
  const id=document.getElementById('subAthleteId').value;
  const lines=String(document.getElementById('substitutionsText').value||'').split('\n').map(x=>x.trim()).filter(Boolean);
  if(lines.length>20){alert('Keep substitutions to 20 or fewer.');return;}
  const code=/^[A-Za-z0-9_-]{2,30}$/;
  const rows=[];
  for(const line of lines){
    const parts=line.split(/\s*->\s*/);
    const from=(parts[0]||'').trim(),to=(parts[1]||'').trim(),note=parts.slice(2).join(' -> ').trim().slice(0,500);
    if(!code.test(from)||!code.test(to)||from===to){alert('Each line must use valid different exercise codes: FROM -> TO -> optional note');return;}
    rows.push({fromExerciseCode:from,toExerciseCode:to,note});
  }
  const {error}=await sb.from('athletes').update({exercise_substitutions:rows}).eq('id',id);
  if(error){alert(error.message);return;}
  document.getElementById('modal').close();
  await load();
}

async function saveAccessCode(){
  const f=new FormData(document.getElementById('modalForm'));
  const type=String(f.get('code_type')||'');
  const target=String(f.get('target_id')||'');
  const raw=String(f.get('raw_code')||'').trim();
  const label=String(f.get('label')||'').trim();
  const expiry=String(f.get('expires_at')||'').trim();
  if(!target||!label||raw.length<12||raw.length>128){alert('Choose a cohort, add a label, and use a code between 12 and 128 characters.');return;}
  const bytes=new TextEncoder().encode(raw.toLowerCase());
  const digest=await crypto.subtle.digest('SHA-256',bytes);
  const hash=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
  const row={code_type:type,code_hash:hash,status:'active',cohort_id:target,label};
  if(expiry)row.expires_at=new Date(expiry).toISOString();
  const {error}=await sb.from('access_codes').insert(row);
  if(error){alert(error.message);return;}
  document.getElementById('modal').close();
  await load();
  alert('Access code created ✅\n\nCode: '+raw+'\n\nThis readable code is not stored in Supabase. Save/share it securely.');
}

  if(add){

    else if(add.dataset.add==='exercise')exerciseForm();

  }

  const pc=e.target.closest('[data-programme-context]');
  if(pc){
    state.programmeContext={type:pc.dataset.programmeContext,id:pc.dataset.programmeId};
    state.page='programme-editor';
    render();
    return;
  }

  const pd=e.target.closest('[data-preview-day]');
  if(pd){
    const day=byId(state.trainingDays,pd.dataset.previewDay);
    if(day)return previewDay(day);
  }

  const ed=e.target.closest('[data-edit-day]');
  if(ed){
    const day=byId(state.trainingDays,ed.dataset.editDay);
    if(day)return dayEditor(day);
  }

  const eb=e.target.closest('[data-edit-block]');
  if(eb){
    const block=byId(state.sessionBlocks,eb.dataset.editBlock);
    if(block)return blockEditor(block);
  }

  const sub=e.target.closest('[data-substitutions]');
  if(sub){
    const athlete=byId(state.athletes,sub.dataset.substitutions);
    if(athlete)return substitutionForm(athlete);
  }

    const ae=e.target.closest('[data-edit-athlete]');
  if(ae)return athleteForm(byId(state.athletes,ae.dataset.editAthlete)||{});

  const pe=e.target.closest('[data-edit-professional]');
  if(pe)return professionalForm(byId(state.professionals,pe.dataset.editProfessional)||{});

  const ce=e.target.closest('[data-edit-cohort]');
  if(ce)return cohortForm(byId(state.cohorts,ce.dataset.editCohort)||{});

  const ee=e.target.closest('[data-edit-exercise]');
  if(ee)return exerciseForm(byId(state.exercises,ee.dataset.editExercise)||{});

  const access=e.target.closest('[data-access-action]');
  if(access)return changeAccountAccess(access.dataset.accessKind,access.dataset.accessId,access.dataset.accessAction);

  const cr=e.target.closest('[data-code-type]');
  if(cr)return codeForm(cr.dataset.codeType);

  const cs=e.target.closest('[data-code-action]');
  if(cs)return changeCodeStatus(cs.dataset.codeId,cs.dataset.codeAction);

  if(e.target.id==='saveAccessCode')return saveAccessCode();
  if(e.target.id==='saveTrainingDay')return saveTrainingDay();
  if(e.target.id==='saveWorkoutBlock')return saveWorkoutBlock();
  if(e.target.id==='saveSubstitutions')return saveSubstitutions();

  const rv=e.target.closest('[data-review]');
  if(rv){
    const {error}=await sb.from('feedback').update({reviewed_at:new Date().toISOString()}).eq('id',rv.dataset.review);
    if(error)alert(error.message);else await load();
    return;
  }

  if(e.target.id==='logout'){await sb.auth.signOut();location.reload();return;}

  if(e.target.id==='passwordReset'){
    const u=(await sb.auth.getUser()).data.user;
    if(u?.email){await sb.auth.resetPasswordForEmail(u.email);alert('Reset email sent.');}
    return;
  }

  if(e.target.id==='saveAthlete'){
    const f=new FormData(document.getElementById('modalForm')),id=f.get('id');
    return save('athletes',{
      full_name:String(f.get('full_name')||'').trim(),
      display_name:String(f.get('display_name')||'').trim(),
      cohort_id:f.get('cohort_id')||null,
      coach_note:String(f.get('coach_note')||'').trim()
    },id);
  }

  if(e.target.id==='saveProfessional'){
    const f=new FormData(document.getElementById('modalForm')),id=f.get('id');
    return save('professional_members',{
      first_name:String(f.get('first_name')||'').trim(),
      last_name:String(f.get('last_name')||'').trim(),
      cohort_id:f.get('cohort_id')||null,
      coach_note:String(f.get('coach_note')||'').trim()
    },id);
  }

  if(e.target.id==='saveCohort'){
    const f=new FormData(document.getElementById('modalForm')),id=f.get('id');
    const programmeId=String(f.get('programme_id')||'');
    const week=+f.get('current_week')||1;
    const status=String(f.get('status')||'draft');
    if(status==='live'&&!publishedWeekReady(programmeId,week)){
      const ok=confirm(`Week ${week} is not currently published and verified for this programme. Saving a live cohort in this state will make the Hub show that the programme is being prepared. Continue?`);
      if(!ok)return;
    }
    return save('cohorts',{
      name:String(f.get('name')||'').trim(),
      programme_id:programmeId||null,
      current_week:week,
      current_phase:String(f.get('current_phase')||'').trim(),
      expected_sessions_per_week:Math.min(7,Math.max(1,+f.get('expected_sessions_per_week')||3)),
      status,
      tier:String(f.get('tier')||'').trim()||null,
      internal_notes:String(f.get('internal_notes')||'').trim()
    },id);
  }

  if(e.target.id==='saveExercise'){
    const f=new FormData(document.getElementById('modalForm')),id=f.get('id'),vid=String(f.get('video_id')||'').trim();
    return save('exercises',{
      code:String(f.get('code')||'').trim().toUpperCase(),
      name:String(f.get('name')||'').trim(),
      category_slug:String(f.get('category_slug')||'').trim(),
      video_id:vid,
      video_url:vid?'https://www.youtube.com/shorts/'+vid:'',
      purpose:String(f.get('purpose')||'').trim(),
      coaching_cues:String(f.get('coaching_cues')||'').trim(),
      default_dosage:String(f.get('default_dosage')||'').trim(),
      active:true
    },id);
  }
});

document.addEventListener('input',e=>{
  if(e.target.id==='search'){
    const q=e.target.value.toLowerCase();
    document.querySelectorAll('[data-search]').forEach(x=>x.style.display=x.dataset.search.includes(q)?'grid':'none');
  }
});

async function authorisedAdmin(){
  const {data:{user},error:userError}=await sb.auth.getUser();
  if(userError||!user)return null;
  const {data,error}=await sb.from('admin_profiles').select('user_id,display_name').eq('user_id',user.id).maybeSingle();
  if(error||!data)return null;
  return data;
}

document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!configured){document.getElementById('setupNotice').classList.remove('hidden');return;}
  const emailValue=document.getElementById('email').value;
  const passwordValue=document.getElementById('password').value;
  const loginErr=document.getElementById('loginErr');
  loginErr.textContent='';
  const {error}=await sb.auth.signInWithPassword({email:emailValue,password:passwordValue});
  if(error){loginErr.textContent=error.message;return;}
  const admin=await authorisedAdmin();
  if(!admin){
    await sb.auth.signOut();
    loginErr.textContent='This account is not authorised for the Du Airlines Control Room.';
    return;
  }
  await init();
});

async function init(){
  if(!configured){document.getElementById('setupNotice').classList.remove('hidden');return;}
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const admin=await authorisedAdmin();
  if(!admin){
    await sb.auth.signOut();
    document.getElementById('loginErr').textContent='This account is not authorised for the Du Airlines Control Room.';
    return;
  }
  state.admin=admin;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await load();
}
init();

</script></body></html>
